<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Payment | Shirzad Photography</title>

    <link rel="stylesheet"
          href="bootstrap-5.3.8-dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <style>
        body {
            background: #100b18;
            color: #fff;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            padding: 40px 15px;
        }

        .payment-card {
            max-width: 550px;
            margin: 20px auto;
            padding: 30px;
            background: #1b1426;
            border: 1px solid #49345e;
            border-radius: 20px;
        }

        .payment-icon {
            color: #c9a7ff;
            font-size: 45px;
        }

        .form-control, .form-select {
            background: #100b18;
            color: #fff;
            border: 1px solid #49345e;
            padding: 12px;
        }

        .form-control:focus, .form-select:focus {
            background: #100b18;
            color: #fff;
            border-color: #c9a7ff;
            box-shadow: 0 0 0 3px rgba(201,167,255,.15);
        }

        .form-control::placeholder {
            color: #a69aaf;
        }

        .price-box {
            background: #291d39;
            padding: 18px;
            border-radius: 12px;
            margin: 20px 0;
        }

        .pay-button {
            width: 100%;
            background: #c9a7ff;
            color: #170f22;
            border: none;
            border-radius: 30px;
            padding: 13px;
            font-weight: bold;
        }

        .pay-button:hover {
            background: #b58aef;
        }

        .notice {
            color: #c8bdcf;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <main class="payment-card">
        <div class="text-center">
            <i class="bi bi-shield-lock payment-icon"></i>
            <h1 class="mt-3">Premium Payment</h1>
            <p class="text-secondary">
                Shirzad Photography
            </p>
        </div>

        <div class="price-box">
            <div class="d-flex justify-content-between">
                <span>Premium Plan</span>
                <strong id="planPrice">$15.00</strong>
            </div>
            <hr>
            <div class="d-flex justify-content-between">
                <strong>Total</strong>
                <strong id="totalPrice">$15.00</strong>
            </div>
        </div>

        <form id="paymentForm">
            <label class="form-label" for="customerName">
                Full Name
            </label>
            <input class="form-control mb-3"
                   id="customerName"
                   type="text"
                   placeholder="Enter your full name"
                   required>

            <label class="form-label" for="customerEmail">
                Email Address
            </label>
            <input class="form-control mb-3"
                   id="customerEmail"
                   type="email"
                   placeholder="you@example.com"
                   required>

            <label class="form-label" for="paymentMethod">
                Payment Method
            </label>
            <select class="form-select mb-3"
                    id="paymentMethod" required>
                <option value="">Choose a method</option>
                <option value="bank">Bank Transfer</option>
                <option value="manual">Contact Photographer</option>
            </select>

            <p class="notice">
                <i class="bi bi-info-circle"></i>
                This is a demo checkout. No real payment will be
                processed, and no bank-card details are requested.
            </p>
            <button type="submit" class="pay-button mt-3">
                <i class="bi bi-lock-fill"></i>
                Continue
            </button>

            <a href="checklist.html"
               class="btn btn-outline-light rounded-pill w-100 mt-3">
                Back to Checklist
            </a>
        </form>

        <p id="paymentMessage"
           class="text-center mt-3"
           role="status"></p>
    </main>

    <script>
        document.getElementById("paymentForm")
            .addEventListener("submit", function(event) {
                event.preventDefault();

                const method =
                    document.getElementById("paymentMethod").value;

                const message =
                    document.getElementById("paymentMessage");

                if (method === "bank") {
                    message.textContent =
                        "Please contact the photographer to receive verified bank transfer instructions.";
                } else {
                    message.textContent =
                        "Please contact the photographer to arrange your payment.";
                }
            });
    </script>
</body>
</html>

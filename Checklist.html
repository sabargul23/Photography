    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Checklist | Shirzad Photography</title>

    <link rel="stylesheet" href="bootstrap-5.3.8-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <style>
        body {
            background: #100b18;
            color: #fff;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            padding: 40px 15px;
        }

        .checklist-card {
            max-width: 600px;
            margin: 30px auto;
            padding: 30px;
            background: #1b1426;
            border: 1px solid #49345e;
            border-radius: 20px;
        }

        .checklist-icon {
            font-size: 45px;
            color: #c9a7ff;
        }

        .checklist-item {
            display: flex;
            gap: 12px;
            align-items: flex-start;
            padding: 15px 0;
            border-bottom: 1px solid #382944;
        }

        .checklist-item input {
            width: 18px;
            height: 18px;
            margin-top: 4px;
            accent-color: #c9a7ff;
        }

        .btn-premium {
            background: #c9a7ff;
            color: #170f22;
            border: none;
            padding: 12px 25px;
            border-radius: 30px;
            font-weight: bold;
        }

        .btn-premium:hover {
            background: #b58aef;
        }
    </style>
</head>

<body>
      <!----Navbar--->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container">
            <!---Logo--->
            <a class="navbar-brand fw-bold" href="#">
                <i class="bi bi-camera"></i>
                Shirzad Photography
            </a>
            <!----Mobile Button---->
            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav"
                    aria-controls="navbarNav"
                    aria-expanded="false"
                    aria-label="Toggle navigation"
                    >
                    <span class="navbar-toggler-icon"></span>
                </button>
                <!----Meun---->
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav mx-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="gallery.html">Gallery</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="ai-studio.html">AI Studio</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="pricing.html">Pricing</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="about.html">About</a>
                        </li>
                         <li class="nav-item">
                            <a class="nav-link" href="Contact.html">Contact</a>
                        </li>
                          </li>
                          <li class="nav-item">
                            <a class="nav-link" href="booking.html">Booking</a>
                        </li>
                          </li>
                          <li class="nav-item">
                            <a class="nav-link" href="Profile.html">
                                <i class="bi bi-person-circle"></i>Profile</a>
                        </li>
                        <li class="nav-item">
                            <a href="login.html" class="btn btn-light rounded-pill px-4">Login</a>
                        </li>
                    
                    </ul>
                </div>   
        </div>
    </nav>
    <main class="checklist-card">
        <div class="text-center mb-4">
            <i class="bi bi-gem checklist-icon"></i>
            <h1 class="mt-3">Premium Checklist</h1>
            <p class="text-secondary">
                Review your premium photography request.
            </p>
        </div>

        <form id="premiumChecklist">
            <label class="checklist-item">
                <input type="checkbox" required>
                <span>I have selected the Premium Plan.</span>
            </label>

            <label class="checklist-item">
                <input type="checkbox" required>
                <span>I have reviewed the premium features and price.</span>
            </label>

            <label class="checklist-item">
                <input type="checkbox" required>
                <span>I agree to continue with my premium request.</span>
            </label>

            <button type="submit" class="btn btn-premium w-100 mt-4">
                Confirm & Continue
                <i class="bi bi-arrow-right"></i>
            </button>

            <a href="index.html"
               class="btn btn-outline-light w-100 rounded-pill mt-3">
                Back to Home
            </a>
        </form>
    </main>

    <script>
        document.getElementById("premiumChecklist").addEventListener("submit", function(event) {
            event.preventDefault();

            if (this.checkValidity()) {
                window.location.href="payment.html"

            }
        });
    </script>
</body>
</html>

    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Checklist | Shirzad Photography</title>

    <link rel="stylesheet" href="bootstrap-5.3.8-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <style>
        body {
            background: #100b18;
            color: #fff;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            padding: 40px 15px;
        }

        .checklist-card {
            max-width: 600px;
            margin: 30px auto;
            padding: 30px;
            background: #1b1426;
            border: 1px solid #49345e;
            border-radius: 20px;
        }

        .checklist-icon {
            font-size: 45px;
            color: #c9a7ff;
        }

        .checklist-item {
            display: flex;
            gap: 12px;
            align-items: flex-start;
            padding: 15px 0;
            border-bottom: 1px solid #382944;
        }

        .checklist-item input {
            width: 18px;
            height: 18px;
            margin-top: 4px;
            accent-color: #c9a7ff;
        }

        .btn-premium {
            background: #c9a7ff;
            color: #170f22;
            border: none;
            padding: 12px 25px;
            border-radius: 30px;
            font-weight: bold;
        }

        .btn-premium:hover {
            background: #b58aef;
        }
    </style>
</head>

<body>
    <main class="checklist-card">
        <div class="text-center mb-4">
            <i class="bi bi-gem checklist-icon"></i>
            <h1 class="mt-3">Premium Checklist</h1>
            <p class="text-secondary">
                Review your premium photography request.
            </p>
        </div>

        <form id="premiumChecklist">
            <label class="checklist-item">
                <input type="checkbox" required>
                <span>I have selected the Premium Plan.</span>
            </label>

            <label class="checklist-item">
                <input type="checkbox" required>
                <span>I have reviewed the premium features and price.</span>
            </label>

            <label class="checklist-item">
                <input type="checkbox" required>
                <span>I agree to continue with my premium request.</span>
            </label>

            <button type="submit" class="btn btn-premium w-100 mt-4">
                Confirm & Continue
                <i class="bi bi-arrow-right"></i>
            </button>

            <a href="index.html"
               class="btn btn-outline-light w-100 rounded-pill mt-3">
                Back to Home
            </a>
        </form>
    </main>

    <script>
        document.getElementById("premiumChecklist").addEventListener("submit", function(event) {
            event.preventDefault();

            if (this.checkValidity()) {
                window.location.href="payment.html"

            }
        });
    </script>
</body>
</html>

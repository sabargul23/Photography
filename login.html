<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Shirzad Photography</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="bootstrap-5.3.8-dist/css/bootstrap.min.css">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Main CSS -->
    <link rel="stylesheet"
          href="Css/style.css">

</head>


<body class="login-page">


    <!-- ================= LOGIN ================= -->

    <section class="login-section">

        <div class="login-card">

            <!-- Logo -->

            <div class="login-logo">

                <i class="bi bi-camera"></i>

                <h2>
                    Shirzad Photography
                </h2>

            </div>


            <h3>
                Welcome Back
            </h3>

            <p class="login-text">
                Login to continue to your account.
            </p>


            <!-- Login Form -->

            <form id="loginForm">


                <!-- Email -->

                <div class="login-input">

                    <label for="loginEmail">
                        Email Address
                    </label>

                    <div class="input-box">

                        <i class="bi bi-envelope"></i>

                        <input
                            type="email"
                            id="loginEmail"
                            placeholder="Enter your email"
                            required>

                    </div>

                </div>


                <!-- Password -->

                <div class="login-input">

                    <label for="loginPassword">
                        Password
                    </label>

                    <div class="input-box">

                        <i class="bi bi-lock"></i>

                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Enter your password"
                            required>

                    </div>

                </div>


                <!-- Remember -->

                <div class="login-options">

                    <label>
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="#">
                        Forgot Password?
                    </a>

                </div>


                <!-- Button -->

                <button
                    type="submit"
                    class="login-btn">

                    <i class="bi bi-box-arrow-in-right"></i>

                    Login

                </button>


            </form>


            <!-- Register -->

            <p class="register-text">

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </p>


            <!-- Back -->

            <a href="gallery.html"
               class="back-gallery">

                <i class="bi bi-arrow-left"></i>

                Back to Gallery

            </a>

        </div>

    </section>


    <!-- ================= FOOTER ================= -->

    <footer class="site-footer login-footer">

        <div class="container text-center">

            <p>
                © 2026 Shirzad Photography.
                All Rights Reserved.
            </p>

        </div>

    </footer>


    <!-- Bootstrap JS -->

    <script src="bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>

    <!-- Login JS -->

    <script src="js/login.js"></script>

</body>

</html>
